appId: co.edu.javeriana.mailwatch
productName: MailWatch
copyright: Proyecto 2 · MailWatch

# Exacta a propósito: electron-builder descarga los binarios de esta versión.
electronVersion: 43.3.0

directories:
  output: release
  buildResources: build

# `out/` es lo que produce electron-vite; node_modules no hace falta porque
# Vite ya empaquetó las dependencias dentro de esos archivos.
files:
  - out/**/*
  - package.json

win:
  icon: icon.ico
  target:
    # Instalador con asistente, para dejarlo instalado en el equipo.
    - target: nsis
      arch: [x64]
    # Ejecutable único que corre sin instalar: lo más práctico para sustentar.
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MailWatch

portable:
  artifactName: MailWatch-portable-${version}.exe
